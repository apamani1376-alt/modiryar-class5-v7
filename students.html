<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پرونده دانش‌آموزان</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

<div class="header">

<h1>👨‍🎓 پرونده دانش‌آموزان</h1>

<p>کلاس پنجم - مدیریت هوشمند</p>

</div>


<div id="students-container"></div>


</div>


<script src="students.js"></script>


<script>

let box = document.getElementById("students-container");


students.forEach(student => {


box.innerHTML += `

<div class="card">

<h2>
👤 ${student.name}
</h2>

<p>
گروه: ${student.group}
</p>

<p>
سطح علمی: ثبت نشده
</p>

<button>
ورود به پرونده
</button>

</div>

`;


});


</script>


</body>

</html>
