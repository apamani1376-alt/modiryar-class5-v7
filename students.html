<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
پرونده دانش‌آموزان
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<div class="header">

<h1>
👨‍🎓 پرونده دانش‌آموزان
</h1>

<p>
مدیریت هوشمند کلاس پنجم
</p>

</div>



<div id="students-list">

</div>



</div>



<script src="students.js"></script>


<script>


const list = document.getElementById("students-list");


students.forEach(student => {


list.innerHTML += `


<div class="card">


<h2>
👤 ${student.name}
</h2>


<p>
گروه: ${student.group || "ثبت نشده"}
</p>


<p>
سطح علمی:
${student.level || "ثبت نشده"}
</p>


<p>
تمرکز:
${student.concentration || "ثبت نشده"}
</p>


<p>
مسئولیت‌پذیری:
${student.responsibility || "ثبت نشده"}
</p>



<button onclick="openStudent(${student.id})">

📂 مشاهده پرونده

</button>


</div>


`;


});




function openStudent(id){


alert("پرونده دانش‌آموز شماره " + id + " در حال ساخت است");


}


</script>



</body>

</html>
